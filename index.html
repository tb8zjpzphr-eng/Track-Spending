function periodOf(date){const d=new Date(date+'T12:00:00');let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<25){m--;if(m<0){m=11;y--}}return `${y}-${String(m+1).padStart(2,'0')}`};function periodDates(p){let [y,m]=p.split('-').map(Number);const start=new Date(y,m-1,25),end=new Date(y,m,24);return {start:`${y}-${String(m).padStart(2,'0')}-25`,end:`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-24`,label:`${start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`}}function prevPeriod(p){let[y,m]=p.split('-').map(Number);m--;if(m<1){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`};function nextPeriod(p){let[y,m]=p.split('-').map(Number);m++;if(m>12){m=1;y++}return `${y}-${String(m).padStart(2,'0')}`};function current(){return periodOf(today())};function ensurePeriod(p){if(state.budgets[p])return;const prev=prevPeriod(p);let amounts={};const earlier=Object.keys(state.budgets).filter(k=>k<p).sort().pop();if(earlier)amounts={...state.budgets[earlier].amounts};else state.categories.forEach(c=>amounts[c.id]=c.amount);state.categories.forEach(c=>{if(amounts[c.id]===undefined)amounts[c.id]=c.amount});state.budgets[p]={income:earlier?state.budgets[earlier].income:state.income,amounts};save()};function activePeriod(){return selectedPeriod||current()};function txs(p=activePeriod()){return state.transactions.filter(t=>periodOf(t.date)===p)};function cat(id){return state.categories.find(c=>c.id===id)};function kind(t){return t.type||cat(t.categoryId)?.type||'expense'};function spent(p=activePeriod(),categoryId=null){return txs(p).filter(t=>kind(t)==='expense'&&(!categoryId||t.categoryId===categoryId)).reduce((s,t)=>s+t.amount,0)};function sumType(p,type){return txs(p).filter(t=>kind(t)===type).reduce((s,t)=>s+t.amount,0)};function budgetAmount(p,c){ensurePeriod(p);return Number(state.budgets[p].amounts[c.id]||0)};function row(label,value){return `<div class="row item"><span>${esc(label)}</span><strong>${value}</strong></div>`};function periodPicker(){const p=activePeriod(),all=new Set([current(),p,...Object.keys(state.budgets),...state.transactions.map(t=>periodOf(t.date))]);return `<div class="card"><label for="period">Pay period</label><select id="period">${[...all].sort().reverse().map(x=>`<option value="${x}" ${x===p?'selected':''}>${periodDates(x).label}</option>`).join('')}</select></div>`};function show(p){page=p;editing=null;render()};function render(){const titles={dashboard:'Dashboard',transactions:'Transactions',add:'Add transaction',budget:'Budget',settings:'Settings'};document.getElementById('pageTitle').textContent=titles[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));ensurePeriod(activePeriod());document.getElementById('app').innerHTML=({dashboard:dashboard,transactions:transactionsPage,add:addPage,budget:budgetPage,settings:settingsPage})[page]();bind()};function dashboard(){const p=activePeriod(),b=state.budgets[p],alloc=state.categories.filter(c=>!c.archived).reduce((s,c)=>s+budgetAmount(p,c),0),total=spent(p),saving=sumType(p,'saving'),transfers=sumType(p,'transfer'),repay=sumType(p,'repayment'),f=state.focus[p]||{},prior=prevPeriod(p),previous=spent(prior);const byGroup=['Commitments','Everyday spending','Savings'].map(g=>{let cats=state.categories.filter(c=>c.group===g&&!c.archived);return `<h3>${g}</h3>${cats.map(c=>{let used=txs(p).filter(t=>t.categoryId===c.id).reduce((s,t)=>s+t.amount,0),amount=budgetAmount(p,c);return `<div class="item"><div class="row"><span>${esc(c.name)}</span><strong>${fmt(used)} / ${fmt(amount)}</strong></div><div class="bar"><span class="${used>amount?'over':''}" style="width:${Math.min(100,amount>0?used/amount*100:used>0?100:0)}%"></span></div><small class="${used>amount?'warn':'muted'}">${used>amount?fmt(used-amount)+' over':fmt(amount-used)+' remaining'}</small></div>`}).join('')}`}).join('');return periodPicker()+ "margin-top:12px">${list.length} entries · ${fmt(list.filter(t=>kind(t)==='expense').reduce((s,t)=>s+t.amount,0))} spending</div>${list.map(t=>`<div class="item row"><div><strong>${esc(t.description)}</strong><div class="muted tiny">${esc(t.date)} · ${esc(cat(t.categoryId)?.name||'Deleted category')} · ${esc(kind(t))}${t.direction==='out'?' (withdrawal)':''}</div></div><div class="right"><strong>${t.direction==='out'?'-':''}${fmt(t.amount)}</strong><br><button class="small secondary" data-edit="${t.id}">Edit</button></div></div>`).join('')||'<p class="muted">No transactions found.</p>'}</div>`};function addPage(){const t=state.transactions.find(x=>x.id===editing),options=state.categories.filter(c=>!c.archived||c.id===t?.categoryId);return `<form id="transaction" class="card"><h2>${t?'Edit transaction':'Quick add'}</h2><label>Description / Merchant</label><input name="description" required maxlength="120" placeholder="e.g. Tesco" value="${esc(t?.description||'')}"><label>Category</label><select name="categoryId" required>${options.map(c=>`<option value="${c.id}" ${t?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Amount (£)</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required placeholder="0.00" value="${t?.amount||''}">${t?`<label>Date</label><input name="date" type="date" required value="${esc(t.date)}">`:'<p class="muted tiny">Date recorded automatically when saved.</p>'}<div id="withdrawalArea"></div><div class="actions"><button type="submit">${t?'Save changes':'Save transaction'}</button>${t?`<button type="button" class="danger" id="deleteTx">Delete</button><button type="button" class="secondary" id="cancelTx">Cancel</button>`:''}</div></form>`};function budgetPage(){const p=activePeriod(),b=state.budgets[p],total=state.categories.filter(c=>!c.archived).reduce((s,c)=>s+budgetAmount(p,c),0);return periodPicker()+`<div class="card"><h2>Budget allocations</h2><label>Income budget (£)</label><input id="income" type="number" min="0" step="0.01" value="${b.income}">${row('Total allocated',fmt(total))}${row('Unallocated buffer',`<span class="${b.income-total<0?'warn':''}">${fmt(b.income-total)}</span>`)}<p class="muted tiny">Each new period copies the previous period's allocations. Unused money does not roll over.</p></div><div class="card"><div class="row"><h2>Categories</h2><button class="small" data-action="add-category">+ Add</button></div>${['Commitments','Everyday spending','Savings'].map(g=>`<h3>${g}</h3>${state.categories.filter(c=>c.group===g&&!c.archived).map(c=>`<div class="item"><div class="row"><div><strong>${esc(c.name)}</strong><div class="muted tiny">${esc(c.type)}</div></div><button class="small secondary" data-cat-edit="${c.id}">Rename / Manage</button></div><label>Monthly allocation (£)</label><input class="allocation" data-cat="${c.id}" type="number" min="0" step="0.01" value="${budgetAmount(p,c)}"></div>`).join('')}`).join('')}</div><div class="card"><div class="row"><h2>Savings goals</h2><button class="small" data-action="add-goal">+ Add</button></div>${state.goals.map(g=>{const contribution=state.transactions.filter(t=>t.categoryId===state.categories.find(c=>c.name===g.categoryName)?.id&&kind(t)==='saving').reduce((s,t)=>s+(t.direction==='out'?-t.amount:t.amount),0),bal=g.opening+contribution;return `<div class="item"><div class="row"><strong>${esc(g.name)}</strong><button class="small secondary" data-goal-edit="${g.id}">Edit</button></div><div>${fmt(bal)} / ${fmt(g.target)}</div><div class="bar"><span style="width:${g.target>0?Math.min(100,Math.max(0,bal/g.target*100)):0}%"></span></div></div>`}).join('')}</div>`};function settingsPage(){return `<div class="card"><h2>Monthly review</h2><p class="muted">Export the selected payday period (25th–24th) for ChatGPT analysis.</p>${periodPicker()}<div class="actions"><button data-action="export-xlsx">Excel report</button><button class="secondary" data-action="export-csv">Transactions CSV</button><button class="secondary" data-action="copy-summary">Copy summary</button></div></div><div class="card"><h2>Backup and restore</h2><p class="notice">Your data is stored only on this iPhone in this browser. Clearing website data, reinstalling, or losing the phone may erase it. Save a JSON backup to Files/iCloud Drive regularly.</p><div class="actions"><button data-action="backup">Download full backup</button></div><label>Restore JSON backup</label><input id="restore" type="file" accept="application/json,.json"><p class="muted tiny">Restoring replaces all current app data. Keep a copy first.</p></div><div class="card"><h2>Install on iPhone</h2><p>Open your GitHub Pages site in Safari, tap Share, then <strong>Add to Home Screen</strong>.</p><p class="muted tiny">No login, tracking service or remote database.</p></div>`};
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>show(x.dataset.page));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action));const picker=document.getElementById('period');if(picker)picker.onchange=e=>{selectedPeriod=e.target.value;render()};document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{editing=x.dataset.edit;page='add';render()});document.querySelectorAll('[data-cat-edit]').forEach(x=>x.onclick=()=>editCategory(x.dataset.catEdit));document.querySelectorAll('[data-goal-edit]').forEach(x=>x.onclick=()=>editGoal(x.dataset.goalEdit));document.querySelectorAll('.allocation').forEach(x=>x.onchange=()=>{state.budgets[activePeriod()].amounts[x.dataset.cat]=Math.max(0,Number(x.value)||0);save();render()});const income=document.getElementById('income');if(income)income.onchange=()=>{state.budgets[activePeriod()].income=Math.max(0,Number(income.value)||0);save();render()};const search=document.getElementById('search');if(search)search.oninput=()=>{filter=search.value;const pos=search.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)};const cf=document.getElementById('catfilter');if(cf)cf.onchange=()=>{categoryFilter=cf.value;render()};const form=document.getElementById('transaction');if(form){const select=form.elements.categoryId;const area=document.getElementById('withdrawalArea');function direction(){const c=cat(select.value);area.innerHTML=c?.type==='saving'?`<label>Saving movement</label><select name="direction"><option value="in">Contribution (add to savings)</option><option value="out">Withdrawal (take from savings)</option></select>`:'';if(area.querySelector('select'))area.querySelector('select').value=state.transactions.find(t=>t.id===editing)?.direction||'in'}select.onchange=direction;direction();form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),amount=Number(fd.get('amount')),description=String(fd.get('description')).trim(),c=cat(fd.get('categoryId'));if(!description||!c||!Number.isFinite(amount)||amount<=0)return;const old=state.transactions.find(t=>t.id===editing);const item={id:old?.id||id(),description,categoryId:c.id,amount:Math.round(amount*100)/100,date:old?fd.get('date'):today(),type:c.type,direction:fd.get('direction')||'in'};if(!/^\d{4}-\d{2}-\d{2}$/.test(item.date))return;state.transactions=old?state.transactions.map(t=>t.id===old.id?item:t):[item,...state.transactions];ensurePeriod(periodOf(item.date));save();editing=null;page='transactions';render()};const del=document.getElementById('deleteTx');if(del)del.onclick=()=>{if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(t=>t.id!==editing);save();show('transactions')}};const cancel=document.getElementById('cancelTx');if(cancel)cancel.onclick=()=>show('transactions')}const restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{const file=restore.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.categories)||!Array.isArray(obj.transactions)||!obj.budgets||!Array.isArray(obj.goals)||!obj.focus)throw Error('Invalid backup');if(confirm('Replace all existing data with this backup?')){state=obj;save();selectedPeriod=null;show('dashboard')}}catch(e){alert('Backup could not be read: '+e.message)}}}
function action(a){if(a==='focus'){const p=activePeriod(),f=state.focus[p]||{},title=prompt('Monthly focus headline',f.title||'Spend deliberately. Protect our savings.');if(title===null)return;const reminder=prompt('Before-buying reminder',f.reminder||'Do I need it? Can it wait? Is it within budget?');if(reminder===null)return;const rules=prompt('Spending rules (one per line)',f.rules||'');if(rules===null)return;const priorities=prompt('Financial priorities (one per line)',f.priorities||'');if(priorities===null)return;state.focus[p]={title,reminder,rules,priorities};save();render()}if(a==='add-category')editCategory(null);if(a==='add-goal')editGoal(null);if(a==='backup')download('my-spending-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(a==='export-csv')exportCSV();if(a==='export-xlsx')exportExcel();if(a==='copy-summary')copySummary()};function editCategory(cid){let c=cat(cid);const name=prompt('Category name',c?.name||'');if(name===null||!name.trim())return;const group=prompt('Group: Commitments, Everyday spending, or Savings',c?.group||'Everyday spending');if(group===null)return;if(!['Commitments','Everyday spending','Savings'].includes(group)){alert('Choose one of the three group names exactly.');return}const type=prompt('Transaction type: expense, income, transfer, saving, repayment',c?.type||'expense');if(type===null)return;if(!['expense','income','transfer','saving','repayment'].includes(type)){alert('Invalid transaction type');return}if(c){c.name=name.trim();c.group=group;c.type=type;if(confirm('Archive this category instead of keeping it active?\nOK = archive, Cancel = keep active'))c.archived=true}else{c={id:id(),name:name.trim(),group,type,amount:0,archived:false};state.categories.push(c);state.budgets[activePeriod()].amounts[c.id]=0}save();render()};function editGoal(gid){let g=state.goals.find(x=>x.id===gid);const name=prompt('Savings goal name',g?.name||'');if(name===null||!name.trim())return;const target=prompt('Target (£)',String(g?.target||0));if(target===null)return;const opening=prompt('Starting balance (£) — before recorded contributions',String(g?.opening||0));if(opening===null)return;const categoryName=prompt('Linked savings category name (must match exactly)',g?.categoryName||'');if(categoryName===null)return;if(!Number.isFinite(Number(target))||!Number.isFinite(Number(opening))||Number(target)<0)return alert('Invalid amount');if(categoryName&&!state.categories.some(c=>c.name===categoryName&&c.type==='saving'))return alert('Choose an existing category of type saving');if(g){Object.assign(g,{name:name.trim(),target:Number(target),opening:Number(opening),categoryName})}else state.goals.push({id:id(),name:name.trim(),target:Number(target),opening:Number(opening),categoryName});save();render()};function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')};function exportCSV(){const rows=[['Date','Description','Category','Group','Type','Movement','Amount GBP'],...txs().map(t=>[t.date,t.description,cat(t.categoryId)?.name||'',cat(t.categoryId)?.group||'',kind(t),t.direction||'',t.amount])];download('transactions-'+activePeriod()+'.csv','\ufeff'+csv(rows),'text/csv;charset=utf-8')};function summary(){const p=activePeriod(),b=state.budgets[p],lines=[`Pay period: ${periodDates(p).label}`,`Income budget: ${fmt(b.income)}`,`Recorded income: ${fmt(sumType(p,'income'))}`,`Expenses: ${fmt(spent(p))}`,`Savings contributions (gross): ${fmt(sumType(p,'saving'))}`,`Internal transfers: ${fmt(sumType(p,'transfer'))}`,`Credit card repayments: ${fmt(sumType(p,'repayment'))}`,'Budget vs actual by category:'];state.categories.forEach(c=>{const amt=budgetAmount(p,c),actual=txs(p).filter(t=>t.categoryId===c.id).reduce((s,t)=>s+t.amount,0);if(amt||actual)lines.push(`${c.name}: budget ${fmt(amt)}, recorded ${fmt(actual)} (${c.type})`)});const f=state.focus[p];if(f)lines.push('Monthly Focus:',f.title||'',f.reminder||'',f.rules||'',f.priorities||'');lines.push('Note: savings, internal transfers and credit card repayments are reported separately and excluded from expense totals. A joint account contribution is a transfer, not itemised household spending.');return lines.join('\n')};async function copySummary(){const s=summary();try{await navigator.clipboard.writeText(s);alert('Summary copied')}catch{prompt('Copy your review summary',s)}};
function exportExcel(){const p=activePeriod(),t=txs(p),budget=state.budgets[p],tables=[['Monthly Summary',[['Metric','Value'],['Pay period',periodDates(p).label],['Income budget',budget.income],['Recorded income',sumType(p,'income')],['Expenses',spent(p)],['Savings movements (gross)',sumType(p,'saving')],['Transfers',sumType(p,'transfer')],['Repayments',sumType(p,'repayment')]]],['Budget vs Actual',[['Category','Group','Type','Budget','Recorded','Difference'],...state.categories.map(c=>{const actual=t.filter(x=>x.categoryId===c.id).reduce((s,x)=>s+x.amount,0);return[c.name,c.group,c.type,budgetAmount(p,c),actual,budgetAmount(p,c)-actual]})]],['Transactions',[['Date','Description','Category','Group','Type','Movement','Amount GBP'],...t.map(x=>[x.date,x.description,cat(x.categoryId)?.name||'',cat(x.categoryId)?.group||'',kind(x),x.direction||'',x.amount])]],['Monthly Focus',[['Field','Content'],...Object.entries(state.focus[p]||{}).map(([k,v])=>[k,v])]]];const xmlEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;'}[c]));const sheets=tables.map(([name,rows])=>`<Worksheet ss:Name="${xmlEsc(name)}"><Table>${rows.map(r=>`<Row>${r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${xmlEsc(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`).join('');const xml=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheets}</Workbook>`;download('monthly-review-'+p+'.xml',xml,'application/vnd.ms-excel');alert('Excel-compatible XML report downloaded. Open in Excel or Numbers.')}save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
